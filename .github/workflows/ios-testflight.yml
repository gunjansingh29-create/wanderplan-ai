name: iOS TestFlight Beta

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's new in this build (shown in TestFlight)"
        required: false
        default: "Bug fixes and performance improvements."

# Prevent concurrent builds of the same branch to avoid signing conflicts.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-14  # Apple Silicon runner with Xcode 15

    env:
      # ── Secrets (set these in GitHub → Settings → Secrets) ──────────────
      # APP_STORE_CONNECT_API_KEY_ID     – 10-character key ID
      # APP_STORE_CONNECT_API_ISSUER_ID  – UUID of the issuer
      # APP_STORE_CONNECT_API_PRIVATE_KEY – contents of the .p8 file
      # BUILD_CERTIFICATE_BASE64          – base64-encoded .p12 certificate
      # BUILD_CERTIFICATE_PASSWORD        – password for the .p12 file
      # PROVISIONING_PROFILE_BASE64       – base64-encoded .mobileprovision
      # KEYCHAIN_PASSWORD                 – temporary keychain password (any random string)
      RUBY_VERSION: '3.2'

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node / JS dependencies ──────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # ── 3. Ruby / Bundler (for Fastlane & CocoaPods) ──────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: mobile

      # ── 4. CocoaPods ──────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      # ── 5. Code signing ───────────────────────────────────────────────
      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── 6. Build archive ──────────────────────────────────────────────
      - name: Build iOS archive
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace WanderPlanAI.xcworkspace \
            -scheme WanderPlanAI \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/WanderPlanAI.xcarchive \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="WanderPlan AI Distribution" \
            | xcpretty

      # ── 7. Export IPA ─────────────────────────────────────────────────
      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/WanderPlanAI.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            | xcpretty

      # ── 8. Upload to TestFlight ────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR=$RUNNER_TEMP/private_keys
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_PRIVATE_KEY" > \
            "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/WanderPlanAI.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      # ── 9. Clean up signing assets ────────────────────────────────────
      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision || true
